<!doctype html>
<html lang="hr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TechDingo — uvježbaj SQL, frontend, backend i opće tehničke temelje kroz kratke lekcije i Score Strike izazove."
    />
    <meta name="theme-color" content="#3bb44a" />
    <title>TechDingo — tehnički intervju kao igra</title>

    <!-- Kartica pri dijeljenju linka. og:image MORA biti apsolutan URL -
         crawleri ne razrješavaju relativne putanje i ne izvršavaju JS.
         Uz HashRouter svaka ruta servira ovaj isti dokument, pa je ovo
         jedna kartica za cijelu aplikaciju. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechDingo" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:title" content="TechDingo — tehnički intervju kao igra" />
    <meta
      property="og:description"
      content="1100+ pitanja kroz 11 tema. Kratke lekcije, XP, srca i niz — gradivo se vraća točno kad ga počneš zaboravljati."
    />
    <meta property="og:url" content="https://vilimtrakos.github.io/techdingo/" />
    <meta property="og:image" content="https://vilimtrakos.github.io/techdingo/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TechDingo — tehnički intervju kao igra" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TechDingo — tehnički intervju kao igra" />
    <meta
      name="twitter:description"
      content="1100+ pitanja kroz 11 tema. Kratke lekcije, XP, srca i niz — gradivo se vraća točno kad ga počneš zaboravljati."
    />
    <meta name="twitter:image" content="https://vilimtrakos.github.io/techdingo/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TechDingo" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
